<!DOCTYPE html>
<!-- This tells the browser that this document uses HTML5. -->

<html lang="en">
<!-- This starts the HTML document and tells the browser the page is in English. -->

<head>
    <!-- This begins the head section, which contains information about the webpage. -->

    <meta charset="UTF-8">
    <!-- This sets the character encoding so text and symbols display correctly. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- This makes the webpage display properly on computers, tablets, and phones. -->

    <title>My First Web Page</title>
    <!-- This sets the title that appears on the browser tab. -->

</head>
<!-- This ends the head section. -->

<body>
    <!-- This begins the body section, which contains everything visible on the webpage. -->

    <h1>My First Web Page</h1>
    <!-- This creates the main heading of the webpage. -->

    <p><strong>Username:</strong> ggi</p>
    <!-- This displays the username. The strong tag makes "Username:" bold. -->

    <p><strong>Name:</strong> Goodness Izuehie</p>
    <!-- This displays the student's name. -->

    <p><strong>Course Name:</strong> IS117</p>
    <!-- This displays the course name. -->

    <p><strong>Course Number:</strong> 117</p>
    <!-- This displays the course number. -->

    <p><strong>Section:</strong> 001</p>
    <!-- This displays the course section. -->

    <footer>
        <!-- This begins the footer section at the bottom of the webpage. -->

        <p>&copy; 2026 Goodness Izuehie | Due Date: October 6, 2026</p>
        <!-- This displays the copyright symbol, year, student's name, and assignment due date. -->

    </footer>
    <!-- This ends the footer section. -->

</body>
<!-- This ends the body section of the webpage. -->

</html>
<!-- This ends the HTML document. -->
